name: Build Android APK

on: [push]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: 'temurin'
        java-version: '17'

    - name: Create Minimal Android Project
      run: |
        mkdir -p app/src/main
        echo 'plugins { id "com.android.application" }' > app/build.gradle
        echo 'android { namespace "com.example.chatai" compileSdk 34 defaultConfig { applicationId "com.example.chatai" minSdk 24 targetSdk 34 versionCode 1 versionName "1.0" } }' >> app/build.gradle
        echo 'rootProject.name = "ChatAI-H"' > settings.gradle
        echo 'include ":app"' >> settings.gradle
        echo '<manifest package="com.example.chatai"/>' > app/src/main/AndroidManifest.log

    - name: Build with Gradle
      run: gradle assembleDebug

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: app-debug
        path: app/build/outputs/apk/debug/app-debug.apk
        
      
